name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      # The submodule matters: AboutContractTests reads the pinned backend's
      # FEATURE_ROUTES table, so a checkout without it fails the contract tests
      # rather than silently skipping them.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Package tests
        run: ./test.sh

      # build-for-testing compiles the UI test target too; the live test
      # inside it skips itself when TEST_RUNNER_ARRDECK_LIVE_URL is absent, so
      # CI proves everything compiles without needing a backend to hit.
      - name: App and UI tests build
        run: |
          brew install xcodegen
          cd App && xcodegen
          xcodebuild -project Arrdeck.xcodeproj -scheme Arrdeck \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build-for-testing
