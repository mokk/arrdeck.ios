name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      # The submodule matters: AboutContractTests reads the pinned backend's
      # FEATURE_ROUTES table, so a checkout without it fails the contract tests
      # rather than silently skipping them.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # test.sh also re-derives the generator's spec from the submodule and
      # fails on drift, so a submodule bump without Scripts/derive-spec.sh
      # is caught here rather than by a client typed against the wrong backend.
      - name: Package tests
        run: ./test.sh

      # build-for-testing compiles the UI test target too; the live test
      # inside it skips itself when TEST_RUNNER_ARRDECK_LIVE_URL is absent, so
      # CI proves everything compiles without needing a backend to hit.
      # -skipPackagePluginValidation: xcodebuild otherwise refuses to run the
      # OpenAPI generator plugin, which only Xcode's UI can approve.
      - name: App and UI tests build
        run: |
          brew install xcodegen
          cd App && xcodegen
          xcodebuild -project Arrdeck.xcodeproj -scheme Arrdeck \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build-for-testing
