# xcodegen spec for the app target. The package (ArrdeckKit/ArrdeckUI) builds
# and tests with Command Line Tools alone; only this target needs Xcode.
#
#   brew install xcodegen && cd App && ./generate.sh && open Arrdeck.xcodeproj
# (generate.sh, not bare xcodegen: it copies the package's pinned versions
# into the project so Xcode does not resolve dependencies afresh.)
name: Arrdeck
options:
  bundleIdPrefix: dk.thrawn
  deploymentTarget:
    iOS: "17.0"
packages:
  ArrdeckPackage:
    path: ..
# The App Group the app and its widgets share the snapshot through, for both
# targets. A free (Personal Team) signature may not be allowed one. If the
# phone build fails to sign because of it, set the value below to "" (not
# delete the line: xcodegen rejects an empty group) and run ./generate.sh: the
# app then writes no snapshot and the widgets say "Open arrdeck to load"; the
# Live Activity needs no group and carries on.
# (Sources/ArrdeckGlance/GlanceStore.swift names the group for the Swift side;
# without the entitlement it finds no container and does nothing.)
settingGroups:
  appGroup:
    CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
targets:
  Arrdeck:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ArrdeckPackage
        product: ArrdeckKit
      - package: ArrdeckPackage
        product: ArrdeckUI
      # embedded in the app's PlugIns, so Scripts/install-device.sh installs both
      - target: ArrdeckWidgets
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        # the download progress the app shows while open; see DownloadsLiveActivity
        NSSupportsLiveActivities: true
        # arrdeck://open/<tab> from a widget or the Live Activity.
        CFBundleURLTypes:
          - CFBundleURLName: dk.thrawn.arrdeck
            CFBundleURLSchemes: [arrdeck]
        # Two separate iOS gates with the same silent-timeout symptom, both
        # required for a service on the LAN like http://10.0.0.5:8989 —
        # NSAllowsLocalNetworking lifts ATS's plain-HTTP block for local hosts
        # only (anything else still requires TLS), and the usage description
        # is what makes iOS show the local-network permission prompt at all.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Arrdeck connects to Sonarr, Radarr and your other services on your home network.
    settings:
      groups: [appGroup]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thrawn.arrdeck
        SWIFT_VERSION: "6.0"
        # Personal (free) team: device installs are signed automatically and
        # expire after 7 days. Swap in a paid team ID for 1-year profiles.
        DEVELOPMENT_TEAM: CF87P9CCK2
        CODE_SIGN_STYLE: Automatic
  # Home-screen and Lock Screen widgets plus the Live Activity's views. It
  # links only ArrdeckGlance: the snapshot it reads, no network client.
  ArrdeckWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      # the app's catalog, so the widgets' strings find their Danish too
      # (the extension's Bundle.main is its own bundle, not the app's)
      - path: Sources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: ArrdeckPackage
        product: ArrdeckGlance
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: arrdeck
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      groups: [appGroup]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thrawn.arrdeck.widgets
        SWIFT_VERSION: "6.0"
        # the app's team and signing; a second App ID on the free team
        DEVELOPMENT_TEAM: CF87P9CCK2
        CODE_SIGN_STYLE: Automatic
  ArrdeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Arrdeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thrawn.arrdeck.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Arrdeck:
    build:
      targets:
        Arrdeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ArrdeckUITests]
